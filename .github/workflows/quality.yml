name: Mobile POS quality gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run typecheck
      - run: npm.cmd test
      - run: npm.cmd run lint
      - run: npm.cmd run i18n:check
      - run: npm.cmd run bundle:android
